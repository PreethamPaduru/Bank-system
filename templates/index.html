<!DOCTYPE html>
<html>
<head>
    <title>Python Bank 🏦</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🏦 Python Bank System</h1>
        <h2>Balance: ₹{{ balance }}</h2>
        {% if message %}
            <p class="msg">{{ message }}</p>
        {% endif %}

        <form action="/deposit" method="POST" class="action-form">
            <input type="number" name="amount" placeholder="Deposit Amount" required>
            <button type="submit" class="btn deposit">Deposit</button>
        </form>

        <form action="/withdraw" method="POST" class="action-form">
            <input type="number" name="amount" placeholder="Withdraw Amount" required>
            <button type="submit" class="btn withdraw">Withdraw</button>
        </form>

        <div class="links">
            <a href="/transactions" class="link-btn">View Transactions</a>
            <a href="/plot" class="link-btn">View Chart</a>
        </div>
    </div>
</body>
</html>
